<svg width="100%" viewBox="0 0 680 754" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Number-guessing multi-agent architecture on AWS Bedrock AgentCore</title>
<desc>Orchestrator agent invokes Working and Inspector agents, each isolated to its own AgentCore Gateway and Lambda tool via explicit IAM Deny on the other's gateway. Both agents share Bedrock Claude Haiku and AgentCore Memory. Supporting: SSM Parameter Store, AgentCore Evaluations and Observability.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="754" fill="#FFFFFF"/>
<text x="340" y="12" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Number-guessing multi-agent architecture — AWS Bedrock AgentCore</text>

<!-- Legend -->
<rect x="50" y="24" width="10" height="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="66" y="32" font-size="11" fill="#444441">Agents (LangChain + LangGraph)</text>
<rect x="270" y="24" width="10" height="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="286" y="32" font-size="11" fill="#444441">AgentCore modules</text>
<rect x="460" y="24" width="10" height="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="476" y="32" font-size="11" fill="#444441">AWS services</text>

<!-- CLI entry -->
<rect x="240" y="48" width="200" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">agentcore invoke</text>
<line x1="340" y1="80" x2="340" y2="102" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Orchestrator -->
<rect x="230" y="102" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Orchestrator agent</text>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">LangGraph loop · Runtime</text>

<line x1="290" y1="158" x2="190" y2="188" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="390" y1="158" x2="490" y2="188" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Docker/ECR -->
<rect x="470" y="102" width="165" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="552" y="122" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Docker build → ECR</text>
<text x="552" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">One image per agent</text>
<line x1="470" y1="130" x2="450" y2="130" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Working / Inspector agents -->
<rect x="60" y="188" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="208" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Working agent</text>
<text x="190" y="228" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">LangChain · Runtime</text>

<rect x="360" y="188" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="208" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Inspector agent</text>
<text x="490" y="228" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">LangChain · Runtime</text>

<line x1="190" y1="244" x2="190" y2="274" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="490" y1="244" x2="490" y2="274" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="244" x2="340" y2="452" stroke="#888780" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

<!-- Gateways -->
<rect x="60" y="274" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="294" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Working gateway</text>
<text x="190" y="314" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">IAM: generate_guess only</text>

<rect x="360" y="274" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="294" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Inspector gateway</text>
<text x="490" y="314" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">IAM: read_secret only</text>

<line x1="190" y1="330" x2="190" y2="366" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="490" y1="330" x2="490" y2="366" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Cross-deny annotation (occludes the dashed trunk behind it) -->
<rect x="210" y="344" width="260" height="18" fill="#FFFFFF"/>
<text x="340" y="353" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#A32D2D">✕ cross-gateway access denied (IAM)</text>

<!-- Lambdas -->
<rect x="60" y="366" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="190" y="386" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Lambda: generate_guess</text>
<text x="190" y="406" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">random.randint(low, high)</text>

<rect x="360" y="366" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="490" y="386" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Lambda: read_secret</text>
<text x="490" y="406" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">reads SSM secret_value</text>

<!-- trunk branches into shared services -->
<line x1="340" y1="452" x2="175" y2="486" stroke="#888780" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="452" x2="495" y2="486" stroke="#888780" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>

<!-- Shared: Bedrock + Memory -->
<rect x="70" y="486" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="175" y="506" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">Bedrock Claude Haiku</text>
<text x="175" y="526" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Shared by both agents</text>

<rect x="390" y="486" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="506" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">AgentCore Memory</text>
<text x="495" y="526" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Both agents write turns</text>

<!-- SSM -->
<rect x="230" y="572" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="592" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">SSM Parameter Store</text>
<text x="340" y="612" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">secret_value + max_loops</text>

<!-- Footer: Evaluations + CloudWatch/X-Ray -->
<rect x="140" y="658" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="235" y="678" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">AgentCore Evaluations</text>
<text x="235" y="698" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Lambda-backed evaluator</text>

<rect x="350" y="658" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="445" y="678" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">CloudWatch + X-Ray</text>
<text x="445" y="698" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Traces from all runtimes</text>
</svg>
